<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social preview card for decred.zip. Source for og.png.
       Regenerate the PNG with:  rsvg-convert -w 1200 -h 630 og.svg -o og.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#070a13"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#eef3fb"/>
      <stop offset="0.58" stop-color="#eef3fb"/>
      <stop offset="0.66" stop-color="#7cb0ff"/>
      <stop offset="0.82" stop-color="#3b82f6"/>
      <stop offset="1.00" stop-color="#19c8ad"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="200" cy="140" rx="640" ry="560" fill="url(#glowBlue)"/>
  <ellipse cx="1015" cy="545" rx="660" ry="580" fill="url(#glowTeal)"/>
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Decred logo: rounded blue square + the white DCR marks (dcr.svg paths
       scaled 2.1875x from the 64x64 source into a 140px square at 530,84) -->
  <rect x="530" y="84" width="140" height="140" rx="30" fill="#2970ff"/>
  <g transform="translate(530,84) scale(2.1875)">
    <path d="M43.21 40.24 51 48h-7.65L30.5 35.2h8a6.4 6.4 0 1 0 0-12.8h-2.6L29.43 16h8.72A12.82 12.82 0 0 1 51 28.8c0 5.2-2.3 9.26-7.79 11.44" fill="#fff"/>
    <path d="M20.79 23.76 13 16h7.66l12.85 12.8h-7.95a6.4 6.4 0 1 0 0 12.8h2.59l6.42 6.4h-8.72A12.82 12.82 0 0 1 13 35.2c0-5.2 2.3-9.26 7.79-11.44" fill="#fff"/>
  </g>

  <text x="600" y="362" text-anchor="middle"
        font-family="Adwaita Sans, Inter, 'Liberation Sans', sans-serif"
        font-size="120" font-weight="800" letter-spacing="-3"
        fill="url(#wordmark)">decred.zip</text>

  <text x="600" y="430" text-anchor="middle"
        font-family="Adwaita Sans, Inter, 'Liberation Sans', sans-serif"
        font-size="37" font-weight="400" letter-spacing="0.4"
        fill="#9fb1c6">An archive of Decred resources</text>

  <rect x="520" y="474" width="160" height="5" rx="2.5" fill="url(#rule)"/>

  <text x="600" y="560" text-anchor="middle"
        font-family="Adwaita Sans, Inter, 'Liberation Sans', sans-serif"
        font-size="24" font-weight="600" letter-spacing="5"
        fill="#566782">WALLETS · EXPLORERS · GOVERNANCE · TOOLS</text>
</svg>
